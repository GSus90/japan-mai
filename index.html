<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan Mai</title>
<meta name="theme-color" content="#172E46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan Mai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Indigo-Reiseheft: Papierweiß, Tintenindigo, Stempelrot (aus dem newly-Design übernommen) */
:root{
  --bg:#F5F6F4; --fg:#172E46; --surface:#FFFFFF; --surface2:#E9EDF0; --line:#DCE3E8;
  --muted:#637486; --accent:#172E46; --on-accent:#FFFFFF; --stamp:#BC4334; --stamp-soft:#F5E1DE;
  --ok:#387268; --ok-soft:#DCEBE7; --warn:#936220; --warn-soft:#F4EAD9;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --tab-h:58px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101C2B; --fg:#F1F4F6; --surface:#172E46; --surface2:#213A50; --line:#304A60;
  --muted:#A7B7C6; --accent:#B9D2E6; --on-accent:#101C2B; --stamp:#F68C7A; --stamp-soft:#3B2A31;
  --ok:#8DC5AF; --ok-soft:#1E3A3A; --warn:#EBC48B; --warn-soft:#3A3326; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:inherit}
.screen{padding:12px max(16px,env(safe-area-inset-left,0px)) calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
.screen[hidden]{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:700;font-size:1.35rem;margin:26px 0 10px}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
/* Tab bar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabbar button{border:0;background:none;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);font-weight:500}
nav.tabbar button svg{width:24px;height:24px}
nav.tabbar button[aria-current="true"]{color:var(--stamp)}
/* Day list */
.today{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;width:100%;text-align:left}
.today b{font-family:var(--serif);font-size:1.2rem;display:block}
.days{display:flex;flex-direction:column;gap:12px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 40px 11px 38px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:1rem}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hit{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:start}
.hit img,.hit .ph{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--surface2)}
.hit .tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.hit mark{background:var(--stamp-soft);color:inherit;border-radius:3px;padding:0 1px}
.count{font-size:.84rem;color:var(--muted);margin:0 0 10px}
a.namelink{text-decoration:none;color:inherit;display:inline}
a.namelink .pin{display:inline-block;width:14px;height:14px;margin-left:5px;vertical-align:-1px;color:var(--stamp)}
a.thumblink{display:block}
.src{font-size:.78rem;color:var(--muted)}
.linkbtn.small{font-size:inherit;color:var(--muted)}
.seg2{grid-template-columns:1fr 1fr;margin-bottom:16px}
.pp{margin-left:6px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none}
.daybudget{margin:-6px 0 14px}
.daybudget .linkbtn{font-size:inherit}
.bhero{--b1:#B9D2E6;--b2:#F68C7A;--b3:#8DC5AF;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:16px}
@media (prefers-color-scheme:dark){.bhero{--b1:#172E46;--b2:#BC4334;--b3:#387268}}
.bhero .eyebrow,.bhero .muted{color:inherit;opacity:.8}
.bbig{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.bbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:14px 0 10px}
.blegend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.blegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.brow2{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:1.3rem;line-height:1}
.stepper b{font-size:1.3rem;min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
details.bday{padding:0;overflow:hidden}
details.bday summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;list-style:none}
details.bday summary::-webkit-details-marker{display:none}
details.bday summary>span:first-child{display:flex;flex-direction:column;min-width:0}
.bdt{font-family:var(--serif);font-size:1.02rem}
.bsum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.brow input[type=checkbox]{width:20px;height:20px;accent-color:var(--stamp);margin:0}
.brow.off .bname{color:var(--muted)}
.brow.off .bname>:first-child{text-decoration:line-through}
.bname{min-width:0;display:flex;flex-direction:column;font-size:.92rem;font-weight:600}
.bname .muted{font-weight:400}
.bprice{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.bprice input{width:78px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:16px;font-variant-numeric:tabular-nums}
.brow.snack .bname{font-weight:500;color:var(--muted)}
.bfoot{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.fxcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fxrow{display:flex;align-items:center;gap:10px;padding:14px 16px}
.fxrow+.fxrow{border-top:1px solid var(--line)}
.fxrow .cur{font-family:var(--serif);font-size:1.9rem;font-weight:700;width:36px;text-align:center;color:var(--stamp)}
.fxrow label{flex:1;min-width:0;display:flex;flex-direction:column}
.fxrow label span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fxrow input{border:0;background:none;font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 0;width:100%;min-width:0;outline:none}
.fxrow input:focus-visible{outline:none}
.fxrow:focus-within{background:var(--surface2)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.ratebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.ratebar button{border:0;background:none;color:var(--stamp);font-weight:600;padding:4px 0}
table.fxt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.fxt td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.fxt td:last-child{text-align:right;color:var(--muted)}
.eurnote{color:var(--muted);white-space:nowrap}
.addtitle{font-family:var(--serif);font-size:1.2rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0}
.filebtn.pulse{border-color:var(--stamp);color:var(--stamp);box-shadow:0 0 0 3px var(--stamp-soft)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.88rem;align-self:flex-start;padding:0}
.rec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.recimg{width:100%;max-height:150px;object-fit:cover;object-position:center 65%;border-radius:10px}
.recname{font-family:var(--serif);font-size:1.45rem;font-weight:700;line-height:1.15}
.sug{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.sug b{font-size:1.02rem}
.editgrid{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.raw pre{white-space:pre-wrap;font-size:.75rem;color:var(--muted);max-height:180px;overflow:auto;margin:6px 0 0}
details.raw{padding:8px 10px;background:var(--bg)}
/* Tages-Story */
.playbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 18px}
.playbtn svg{width:18px;height:18px}
.story{position:fixed;inset:0;z-index:50;background:#0b1320;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
.story .bg{position:absolute;inset:-2%;background-size:cover;background-position:center;will-change:transform}
.story .bg.kb{animation:kb var(--dur) linear forwards}
.story .bg.soft{filter:blur(22px) brightness(.55) saturate(1.2);inset:-8%}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translate(-1.5%,-1%)}}
.story .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,22,.6) 0,rgba(8,14,22,0) 20%,rgba(8,14,22,0) 42%,rgba(8,14,22,.9) 100%)}
.story .bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.story .bars span{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story .bars i{display:block;height:100%;width:0;background:#fff}
.story .head{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:16px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.story .close{width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:1.4rem;line-height:1}
.story .tap{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 2fr}
.story .tap button{border:0;background:none}
.story .txt{position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 36px);z-index:2;pointer-events:none;animation:up .6s ease-out both;max-width:560px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.story .stime{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.story .sk{display:inline-block;margin-left:10px;vertical-align:middle;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:#BC4334;padding:3px 8px;border-radius:999px}
.story h2{font-family:var(--serif);font-size:2.1rem;margin:10px 0 8px;color:#fff;line-height:1.08;text-wrap:balance}
.story p{margin:0;color:rgba(255,255,255,.86);font-size:1rem;max-width:38ch}
.story .meta{margin-top:12px;font-size:.82rem;color:rgba(255,255,255,.7)}
.story ol{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.story ol b{display:inline-block;width:52px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7);font-weight:600}
.story .paused{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;background:rgba(0,0,0,.45);border-radius:999px;padding:8px 14px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.story .bg.kb,.story .txt{animation:none}}
.src a{color:var(--stamp);font-weight:600;text-decoration:none}
.dcard{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;width:100%}
.dcard img,.dcard .ph{width:96px;height:100%;min-height:96px;object-fit:cover;background:var(--surface2)}
.dcard .tx{padding:10px 12px 10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.dcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dcard h3{font-family:var(--serif);font-size:1.08rem;line-height:1.2}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--stamp)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.city{background:var(--surface2);color:var(--fg)}
/* Day detail */
.hero{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;position:relative}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;max-height:300px}
.back{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(16,28,43,.6);color:#fff;font-size:1.3rem;display:grid;place-items:center}
.back.plain{position:static;background:var(--surface2);color:var(--fg)}
.daynav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:48px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl>li::before{content:"";position:absolute;left:23px;top:26px;bottom:0;width:1px;background:var(--line)}
.tl>li:last-child::before{display:none}
.time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);text-align:right;padding-top:12px;font-weight:600}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.stop .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stop .row{display:flex;gap:10px;align-items:flex-start}
.stop .name{font-weight:650;flex:1;min-width:0}
.stop .thumb{width:100%;aspect-ratio:21/9;object-fit:cover}
.stop.done .name{text-decoration:line-through;text-decoration-color:var(--stamp)}
.stop.done .thumb{filter:grayscale(.6);opacity:.7}
.kind{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.stamp{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);background:none;display:grid;place-items:center;color:transparent;transition:transform .2s}
.stamp[aria-pressed="true"]{border:2px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg);background:var(--stamp-soft)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;text-decoration:none;font-weight:500}
.chip.s-offen{border-color:var(--stamp);color:var(--stamp)}
.chip.s-angefragt{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.s-bestätigt{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.flag{font-size:.82rem;padding:6px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.own{color:var(--stamp);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-left:6px}
/* Forms and cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .head b{display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shots figure{margin:0;position:relative}
.shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.shots .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(16,28,43,.7);color:#fff;font-size:.9rem}
.addshot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;padding:6px;position:relative;overflow:hidden}
.addshot input{position:absolute;inset:0;opacity:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details+details{margin-top:8px}
summary{font-weight:650;cursor:pointer}
details li,details p{color:var(--muted);font-size:.92rem}
details ul{padding-left:18px;margin:8px 0 2px}
.status{font-size:.86rem;color:var(--muted)}
.status.err{color:var(--stamp)}
.install{background:var(--stamp-soft);color:var(--fg);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:90vw}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(8,14,22,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.viewer img{max-height:100%;object-fit:contain;border-radius:8px}
.credit{font-size:.78rem;color:var(--muted);word-break:break-word}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="screen" id="v-trip"></section>
<section class="screen" id="v-day" hidden></section>
<section class="screen" id="v-book" hidden></section>
<section class="screen" id="v-wish" hidden></section>
<section class="screen" id="v-fx" hidden></section>
<section class="screen" id="v-more" hidden></section>

<nav class="tabbar" aria-label="Bereiche">
  <button data-tab="trip" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5 9 4l6 2 5-1.5V18l-5 1.5-6-2-5 1.5z"/><path d="M9 4v13.5M15 6v13.5"/></svg>Reise</button>
  <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>Buchungen</button>
  <button data-tab="wish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Merkliste</button>
  <button data-tab="fx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l6 8 6-8M12 12v8M7.5 13h9M7.5 16.5h9"/></svg>Geld</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mehr</button>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="viewer" id="viewer" hidden><img alt=""></div>

<script src="data.js"></script>
<script src="recognize.js"></script>
<script>
const TRIP=window.TRIP, CREDITS=window.CREDITS||[];
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const STATES=["offen","angefragt","bestätigt"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapUrl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);

/* ---------- Speicher ---------- */
const KEY="jm-state-v1";
let S={start:"2027-04-02",done:{},book:{},notes:{},journal:{},places:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S={...S,...s}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Speichern fehlgeschlagen. Speicher voll?")}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// Bilder (Tagebuch, Buchungsbelege, Screenshots) in IndexedDB
const IDB=new Promise((res,rej)=>{const r=indexedDB.open("jm-images",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function imgPut(blob){const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const db=await IDB;
  await new Promise((res,rej)=>{const t=db.transaction("img","readwrite");t.objectStore("img").put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)});return id}
async function imgGet(id){const db=await IDB;return new Promise(res=>{const r=db.transaction("img").objectStore("img").get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
async function imgDel(id){const db=await IDB;db.transaction("img","readwrite").objectStore("img").delete(id)}
async function imgAll(){const db=await IDB;return new Promise(res=>{const out={};const r=db.transaction("img").objectStore("img").openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)}})}
const urlCache={};
async function imgUrl(id){if(urlCache[id])return urlCache[id];const b=await imgGet(id);if(!b)return null;return urlCache[id]=URL.createObjectURL(b)}
function shrink(file,max=1600){return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.82)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
// Bilder nach dem Rendern nachladen
async function hydrate(root){for(const el of root.querySelectorAll("img[data-img]")){const u=await imgUrl(el.dataset.img);if(u)el.src=u;else el.closest("figure")?.remove()}}

/* ---------- Daten ---------- */
function dateOf(i){const d=new Date(S.start+"T12:00:00");d.setDate(d.getDate()+i);return d}
const fmt=d=>d.getDate()+"."+(d.getMonth()+1)+".";
const fmtLong=d=>d.toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
function stopsOf(i){
  const base=TRIP[i].stops.map(s=>({...s,own:false}));
  const own=S.places.filter(p=>p.day===i).map(p=>({id:"p-"+p.id,zeit:p.time||"12:00",typ:p.kind||"Essen",name:p.name,info:p.info,maps:p.mapsUrl||mapUrl(p.q||[p.name,p.city].filter(Boolean).join(" ")),tiktok:p.url||null,
    reservierung:p.res?{art:p.res}:null,ruhetage:p.closed||[],photo:null,ownImg:p.img||null,own:true,pid:p.id,quelle:srcOf(p),quelleUrl:p.url||null,preis:p.price!=null?p.price:null}));
  return [...base,...own].sort((a,b)=>a.zeit.localeCompare(b.zeit));
}
function srcOf(p){if(p.src)return p.src;const u=p.url||"";return /tiktok\./i.test(u)?"TikTok":/instagram\./i.test(u)?"Instagram":/youtu/i.test(u)?"YouTube":u?"Link":"Eigene Idee"}
const SRC_ICON=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;
/* TikTok-Links: Video-ID herausziehen und direkt in der TikTok-App öffnen.
   Kurzlinks (vm.tiktok.com) landen aus der Home-Bildschirm-App sonst auf TikToks Webseite mit Login-Popup. */
function ttDecode(u){let t=String(u||"");for(let k=0;k<4;k++){try{const d=decodeURIComponent(t);if(d===t)break;t=d}catch(e){break}}return t}
function ttId(u){const t=ttDecode(u);const m=t.match(/(?:\/video\/|\/v\/|aweme\/detail\/|[?&](?:share_item_id|item_id|click_item_id|page_id)=)(\d{15,21})/);return m?m[1]:""}
function ttUser(u){const m=ttDecode(u).match(/tiktok\.com\/@([\w.\-]+)\/video\//);return m?m[1]:""}
function ttClean(u){const id=ttId(u);if(!id)return u;const us=ttUser(u);return `https://www.tiktok.com/@${us||"_"}/video/${id}`}
function srcLine(s){if(!s.quelle)return"";
  const key=s.id||"",url=(S.linkfix&&S.linkfix[key])||s.quelleUrl||s.tiktok;
  if(!url)return `<div class="src">Quelle: <span>${esc(s.quelle)}${s.quelle==="TikTok"?" (Link nicht gespeichert)":""}</span></div>`;
  const isTT=/tiktok\.com|onelink\.me|snssdk/i.test(url),id=isTT?ttId(url):"";
  if(isTT&&id)return `<div class="src">Quelle: <a href="snssdk1233://aweme/detail/${id}">In TikTok öffnen ${SRC_ICON}</a> · <a href="${esc(ttClean(url))}" target="_blank" rel="noopener">im Browser</a></div>`;
  return `<div class="src">Quelle: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(s.quelle)} ansehen ${SRC_ICON}</a>${isTT&&key?` · <button class="linkbtn small" data-fixlink="${esc(key)}">Öffnet nicht?</button>`:""}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-fixlink]");if(!b)return;
  const v=prompt("Öffne das Video einmal im Browser, kopiere dort die komplette Adresse oben aus der Adresszeile und füge sie hier ein. Die App merkt sich daraus das Video und öffnet es künftig direkt in TikTok.");
  if(!v)return;const id=ttId(v);if(!id){toast("In dieser Adresse steckt keine Video-Nummer.");return}
  S.linkfix=S.linkfix||{};S.linkfix[b.dataset.fixlink]=ttClean(v);save();toast("Gespeichert – öffnet jetzt in TikTok");
  if(tab==="wish")renderWish();else if(!$("#v-day").hidden)renderDay();else goTab(tab)});
const closedOn=(s,i)=>s.ruhetage&&s.ruhetage.includes(WD[dateOf(i).getDay()]);
function todayIndex(){const t=new Date();t.setHours(12,0,0,0);const d0=new Date(S.start+"T12:00:00");const n=Math.round((t-d0)/864e5);return n>=0&&n<14?n:-1}
function bookState(id){return S.book[id]||{status:"offen",number:"",imgs:[]}}

/* ---------- Navigation ---------- */
let tab="trip",curDay=0;
function show(v){document.querySelectorAll(".screen").forEach(s=>s.hidden=s.id!=="v-"+v);window.scrollTo(0,0)}
function goTab(t){tab=t;document.querySelectorAll("nav.tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t));
  ({trip:renderTrip,book:renderBook,wish:renderWish,fx:renderFx,more:renderMore})[t]();show(t)}
function openDay(i){curDay=i;renderDay();show("day")}
document.querySelector("nav.tabbar").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)goTab(b.dataset.tab)});

/* ---------- Reise ---------- */
const isStandalone=()=>window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
function renderTrip(){
  const ti=todayIndex();
  let h=`<div class="topbar"><div><div class="eyebrow">${fmt(dateOf(0))} – ${fmt(dateOf(13))} · 14 Tage</div><h1>Japan im ${dateOf(0).toLocaleDateString("de-AT",{month:"long"})}</h1></div></div>`;
  if(!isStandalone())h+=`<div class="install"><b>Als App installieren:</b> In Safari unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>. Danach startet Japan Mai wie eine App und funktioniert auch ohne Netz.</div>`;
  h+=`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Restaurant oder Ort suchen" value="${esc(searchQ)}" aria-label="Orte durchsuchen"><button class="clear" id="qClear" aria-label="Suche leeren" ${searchQ?"":"hidden"}>×</button></div>
    <div class="filters" role="group" aria-label="Art">${["Alle","Essen","Sehen","Abend"].map(k=>`<button data-kind="${k}" aria-pressed="${searchKind===k}">${k==="Alle"?"Alle":k==="Abend"?"Bars & Abend":k}</button>`).join("")}</div>
    <div id="results"></div><div id="tripMain">`;
  if(ti>=0)h+=`<button class="today" data-day="${ti}"><span><span class="eyebrow" style="color:inherit;opacity:.75">Heute · Tag ${ti+1}</span><b>${esc(TRIP[ti].titel)}</b></span><span>›</span></button>`;
  h+=`<div class="days">`;
  TRIP.forEach((D,i)=>{const st=stopsOf(i),done=st.filter(s=>S.done[s.id]).length,d=dateOf(i),warn=st.some(s=>closedOn(s,i));
    h+=`<button class="dcard" data-day="${i}">${D.photo?`<img src="photos/${D.photo}.jpg" alt="" loading="lazy">`:'<span class="ph"></span>'}
      <span class="tx"><span class="meta"><span>Tag ${i+1} · ${WD[d.getDay()]} ${fmt(d)}</span><span>${esc(D.stadt)}</span></span>
      <h3>${esc(D.titel)}</h3>${warn?'<span><span class="pill warn">Ruhetag prüfen</span></span>':""}
      <span class="bar"><i style="width:${st.length?done/st.length*100:0}%"></i></span></span></button>`});
  $("#v-trip").innerHTML=h+`</div></div>`;
  const q=$("#q");
  q.addEventListener("input",()=>{searchQ=q.value;runSearch()});
  $("#qClear").addEventListener("click",()=>{searchQ="";q.value="";runSearch();q.focus()});
  runSearch();
}
/* ---------- Suche ---------- */
let searchQ="",searchKind="Alle";
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function allPlaces(){
  const out=[];
  TRIP.forEach((D,i)=>stopsOf(i).forEach(s=>{if(s.typ==="Fahrt")return;out.push({id:s.id,name:s.name,info:s.info,typ:s.typ,stadt:D.stadt,day:i,zeit:s.zeit,maps:s.maps,photo:s.photo,ownImg:s.ownImg,tiktok:s.tiktok,quelle:s.quelle,quelleUrl:s.quelleUrl})}));
  S.places.filter(p=>p.day==null).forEach(p=>out.push({id:"p-"+p.id,name:p.name,info:p.info,typ:p.kind||"Essen",stadt:p.city||"",day:null,maps:p.mapsUrl||mapUrl(p.q||[p.name,p.city].filter(Boolean).join(" ")),ownImg:p.img||null,quelle:srcOf(p),quelleUrl:p.url||null}));
  return out;
}
function hl(text,terms){let t=esc(text);terms.forEach(w=>{if(!w)return;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>")});return t}
function runSearch(){
  const box=$("#results"),main=$("#tripMain");if(!box)return;
  const terms=norm(searchQ).split(/\s+/).filter(Boolean);
  document.querySelectorAll(".filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.kind===searchKind));
  $("#qClear").hidden=!searchQ;
  const active=terms.length||searchKind!=="Alle";
  main.hidden=!!active;box.hidden=!active;
  if(!active){box.innerHTML="";return}
  const hits=allPlaces().filter(p=>(searchKind==="Alle"||p.typ===searchKind)&&terms.every(w=>norm([p.name,p.info,p.stadt,p.typ,p.quelle].join(" ")).includes(w)));
  let h=`<p class="count">${hits.length?hits.length+(hits.length===1?" Treffer":" Treffer"):"Nichts gefunden."}${hits.length?" · Name antippen öffnet Google Maps":""}</p><div class="list">`;
  hits.forEach(p=>{const raw=searchQ.trim().split(/\s+/);
    h+=`<div class="hit"><a class="thumblink" href="${p.maps}" target="_blank" rel="noopener" aria-label="${esc(p.name)} in Google Maps">${p.photo?`<img src="photos/${p.photo}.jpg" alt="" loading="lazy">`:p.ownImg?`<img data-img="${p.ownImg}" alt="">`:'<span class="ph"></span>'}</a>
      <div class="tx"><span class="kind">${esc(p.typ)} · ${esc(p.stadt)}</span>
      <a class="namelink" href="${p.maps}" target="_blank" rel="noopener"><b>${hl(p.name,raw)}</b>${PIN}</a>
      ${p.info?`<span class="muted small">${eur(hl(p.info,raw))}</span>`:""}
      <div class="actions">${p.day!=null?`<button class="chip" data-day="${p.day}">Tag ${p.day+1} · ${WD[dateOf(p.day).getDay()]} ${fmt(dateOf(p.day))}${p.zeit?" · "+esc(p.zeit):""}</button>`:`<button class="chip" data-gowish>Merkliste</button>`}
</div>${srcLine(p)}</div></div>`});
  box.innerHTML=h+"</div>";hydrate(box);
}
document.addEventListener("click",e=>{
  const k=e.target.closest("[data-kind]");if(k){searchKind=k.dataset.kind;runSearch();return}
  if(e.target.closest("[data-gowish]"))goTab("wish");
});
const PIN=`<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
document.addEventListener("click",e=>{const d=e.target.closest("[data-day]");if(d&&!e.target.closest("select")){openDay(+d.dataset.day)}});

/* ---------- Tag ---------- */
function renderDay(){
  const i=curDay,D=TRIP[i],d=dateOf(i),st=stopsOf(i);
  let h=`<div class="hero">${D.photo?`<img src="photos/${D.photo}.jpg" alt="">`:""}<button class="back" data-back aria-label="Zurück">‹</button></div>
    <div class="eyebrow">Tag ${i+1} · ${fmtLong(d)}</div><h1>${esc(D.titel)}</h1>
    <p class="muted small" style="margin:6px 0 14px"><span class="pill city">${esc(D.stadt)}</span> Übernachtung: ${esc(D.unterkunft)}</p>
    ${(()=>{const c=dayCost(i),n=bset().persons,t=(c.e+c.f)*n;return t?`<p class="muted small daybudget">Geschätzt heute: <b>${fmtEur(t/effRate())} €</b> für ${n} ${n===1?"Person":"Personen"} (Eintritte & Essen) · <button class="linkbtn" data-gobudget="${i}">Details</button></p>`:""})()}
    <button class="btn primary playbtn" data-story="${i}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Tag als Story ansehen</button><ol class="tl">`;
  st.forEach(s=>{const done=!!S.done[s.id],b=s.reservierung?bookState(s.id):null;
    h+=`<li><div class="time">${esc(s.zeit)}</div><div class="stop ${done?"done":""}">
      ${s.photo&&s.photo!==D.photo?`<a class="thumblink" href="${s.maps}" target="_blank" rel="noopener" aria-label="${esc(s.name)} in Google Maps"><img class="thumb" src="photos/${s.photo}.jpg" alt="" loading="lazy"></a>`:s.ownImg?`<figure style="margin:0"><a class="thumblink" href="${s.maps}" target="_blank" rel="noopener"><img class="thumb" data-img="${s.ownImg}" alt=""></a></figure>`:""}
      <div class="body"><div class="row"><div class="name"><div class="kind">${esc(s.typ)}${s.quelle&&s.quelle!=="Reiseführer"?`<span class="own">${esc(s.quelle)}</span>`:""}${katOf(s)?(counted(s,i)?(priceOf(s)?`<span class="pp">¥${fmtYen(priceOf(s))} p. P.</span>`:`<span class="pp">gratis</span>`):`<span class="pp">Alternative</span>`):""}</div>${s.typ==="Fahrt"?esc(s.name):`<a class="namelink" href="${s.maps}" target="_blank" rel="noopener">${esc(s.name)}${PIN}</a>`}</div>
      <button class="stamp" data-done="${s.id}" aria-pressed="${done}" aria-label="${esc(s.name)} erledigt"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
      ${s.info?`<div class="muted small">${eur(esc(s.info))}</div>`:""}
      ${srcLine(s)}
      ${closedOn(s,i)?`<div class="flag">An einem ${WD[d.getDay()]} meist geschlossen. Tag tauschen oder Öffnungszeiten prüfen.</div>`:""}
      <div class="actions"><a class="chip" href="${s.maps}" target="_blank" rel="noopener">Karte</a>
      ${b?`<button class="chip s-${b.status}" data-gobook="${s.id}">Buchung: ${b.status}</button>`:""}
      ${s.own?`<button class="chip" data-unplan="${s.pid}">Aus dem Tag nehmen</button>`:""}</div></div></div></li>`});
  h+=`</ol><h2>Tagebuch</h2><div class="card"><label class="field"><span>Notizen</span><textarea id="dayNote" placeholder="Was war heute besonders? Adressen, Bestätigungen …">${esc(S.notes[i]||"")}</textarea></label>
    <div class="shots" id="dayShots">${(S.journal[i]||[]).map(id=>`<figure><img data-img="${id}" data-view alt=""><button class="x" data-deljournal="${id}" aria-label="Foto löschen">×</button></figure>`).join("")}
    <label class="addshot">+ Foto<input type="file" accept="image/*" multiple id="journalIn"></label></div></div>
    <div class="daynav"><button class="btn" data-day="${Math.max(0,i-1)}" ${i===0?"disabled":""}>‹ Tag ${i}</button><button class="btn" data-day="${Math.min(13,i+1)}" ${i===13?"disabled":""}>Tag ${i+2} ›</button></div>`;
  const v=$("#v-day");v.innerHTML=h;hydrate(v);
  $("#dayNote").addEventListener("input",e=>{S.notes[i]=e.target.value;save()});
  $("#journalIn").addEventListener("change",async e=>{for(const f of e.target.files){const id=await imgPut(await shrink(f));(S.journal[i]=S.journal[i]||[]).push(id)}save();renderDay();toast("Foto gespeichert")});
}
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-back]")){goTab(tab);return}
  const dn=t.closest("[data-done]");if(dn){const id=dn.dataset.done;S.done[id]=!S.done[id];save();renderDay();if(S.done[id])toast("Abgestempelt");return}
  const gb=t.closest("[data-gobook]");if(gb){goTab("book");setTimeout(()=>document.getElementById("b-"+gb.dataset.gobook)?.scrollIntoView({block:"center"}),50);return}
  const up=t.closest("[data-unplan]");if(up){const p=S.places.find(x=>x.id===up.dataset.unplan);if(p){p.day=null;save();renderDay();toast("Zurück auf der Merkliste")}return}
  const dj=t.closest("[data-deljournal]");if(dj){const id=dj.dataset.deljournal;S.journal[curDay]=(S.journal[curDay]||[]).filter(x=>x!==id);imgDel(id);save();renderDay();return}
  const vw=t.closest("img[data-view]");if(vw){const v=$("#viewer");v.querySelector("img").src=vw.src;v.hidden=false;return}

async function fromLink(){

    if(r.ok){const j=await r.json();const vid=j.embed_product_id||((j.html||"").match(/data-video-id="(\d+)"/)||[])[1];if(vid&&!ttId(link))link=`https://www.tiktok.com/@${j.author_unique_id||ttUser(link)||"_"}/video/${vid}`;text=[j.title,j.author_name?"@"+j.author_name:""].filter(Boolean).join("\n")}}catch(e){}

let tessP=null;
function loadTess(){return tessP||(tessP=new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=()=>res(window.Tesseract);sc.onerror=()=>{tessP=null;rej(new Error("load"))};document.head.appendChild(sc)}))}
// Google Maps: oberste Zeile des weißen Infobereichs unter der Karte finden (Karte und Kartenbeschriftung stören die Erkennung)
function sheetTop(im){const W=120,H=Math.round(120*im.naturalHeight/im.naturalWidth),c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");g.drawImage(im,0,0,W,H);const a=g.getImageData(0,0,W,H).data;let run=0;
  for(let y=0;y<H*.6;y++){let b=0;for(let x=0;x<W;x++){const k=(y*W+x)*4;if(a[k]>225&&a[k+1]>225&&a[k+2]>225)b++}
    run=b/W>.9?run+1:0;if(run>=3)return Math.round((y-2)*im.naturalHeight/H)}
  return 0}
function prepCanvas(im,mode,crop){
  const W=im.naturalWidth,H=im.naturalHeight;const st=crop==="sheet"?sheetTop(im):0;
  const x0=0,y0=crop==="sheet"?st:crop?Math.round(H*.33):0,w=crop&&crop!=="sheet"?Math.round(W*.88):W,h=crop==="sheet"?H-st:crop?Math.round(H*.6):H;
  const sc=Math.min(1,1400/w);const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  const g=c.getContext("2d");g.drawImage(im,x0,y0,w,h,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),a=d.data;
  for(let i=0;i<a.length;i+=4){const y=.299*a[i]+.587*a[i+1]+.114*a[i+2];const v=mode==="white"?(Math.min(a[i],a[i+1],a[i+2])>210?0:255):mode==="light"?(y>150?0:255):(y<110?0:255);a[i]=a[i+1]=a[i+2]=v}
  g.putImageData(d,0,0);return c}
async function fromShot(file){
  tkStatus("Lese den Text aus dem Screenshot … (beim ersten Mal 10–20 Sekunden)");
  const img=await shrink(file,1400);
  let T;try{T=await loadTess()}catch(e){tkStatus("Die Texterkennung braucht beim ersten Mal Internet. Bitte mit Netz noch einmal versuchen.",true);return}
  const url=URL.createObjectURL(file);const im=new Image();
  try{await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url})}catch(e){tkStatus("Das Bild konnte nicht geöffnet werden.",true);return}
  let text="",fallback="",opts=null,fbOpts=null;
  try{
    const bright=(()=>{const c=document.createElement("canvas");c.width=40;c.height=80;const g=c.getContext("2d");g.drawImage(im,0,0,40,80);const a=g.getImageData(0,0,40,80).data;let t=0;for(let k=0;k<a.length;k+=4)t+=.299*a[k]+.587*a[k+1]+.114*a[k+2];return t/(a.length/4)})();
    const order=bright>150?[["dark","sheet"],["dark",false],["white",true]]:[["white",true],["light",true],["white",false],["dark",false]];
    for(const [mode,crop] of order){
      const out=await T.recognize(prepCanvas(im,mode,crop),"eng");const t=out.data.text||"";
      // Bei Google Maps: Name = gut erkannte Zeilen ganz oben im Infobereich, bis zur Bewertungszeile
      let o=null;if(crop==="sheet"){const title=[];for(const l of (out.data.lines||[])){const lt=(l.text||"").trim();if(!lt)continue;if(/(^|\s)[1-5][,.]\d(\s|$)/.test(lt.slice(0,12)))break;if((l.confidence||0)>=70&&Rec.plausible(lt))title.push(lt);else if(title.length)break;if(title.length>=3)break}o={maps:true,title:title.join("\n")}}
      const r=Rec.fromText(t,o);
      if(r.name&&r.city&&r.sure){text=t;opts=o;break}
      if(!fallback&&r.name&&r.city){fallback=t;fbOpts=o}
      text=fallback||t;opts=fallback?fbOpts:o;
    }
  }catch(e){tkStatus("Die Texterkennung hat nicht geklappt. Trag den Namen unten selbst ein.",true)}
  URL.revokeObjectURL(url);
  $("#tkShotBtn")?.classList.remove("pulse");
  process(text,($("#tkLink")?.value||"").trim()||draft?.link||"",img,opts);
}
function dayLabel(i){return `Tag ${i+1} (${WD[dateOf(i).getDay()]} ${fmt(dateOf(i))})`}
function process(text,link,img,opts){

  <details><summary>Gepäck vorausschicken</summary><ul><li>Takkyubin an der Hotelrezeption, ca. 2.000–3.000 Yen, Ankunft am Folgetag.</li><li>Sinnvoll Tokyo→Kyoto und Osaka→Hiroshima, damit Naoshima mit Tagesrucksack geht.</li></ul></details>

  <details><summary>Kirschblüte Anfang April</summary><ul><li>Anfang April ist in Tokyo, Kyoto und Osaka oft Hochsaison der Kirschblüte: wunderschön, aber sehr voll. Beliebte Orte wie Philosophenweg, Burg von Osaka oder Kamo-Fluss früh am Morgen besuchen.</li><li>Hotels und Restaurants so früh wie möglich buchen, Preise sind höher.</li><li>Abends wird es noch kühl (ca. 8–12 °C): eine Jacke mitnehmen.</li><li>Die Golden Week (29. April – 5. Mai) liegt nach eurer Reise.</li></ul></details>
  <h2>Sicherung</h2>
  <div class="card"><p class="muted small" style="margin:0">Alles liegt nur auf diesem iPhone. Vor dem Abflug eine Sicherung in „Dateien“ ablegen.</p>
  <div class="btnrow"><button class="btn primary" id="exportBtn">Sicherung speichern</button><label class="btn" style="position:relative;overflow:hidden">Sicherung laden<input type="file" accept="application/json,.json" id="importIn" style="position:absolute;inset:0;opacity:0"></label></div><div class="status" id="bkStatus"></div></div>
  <h2>App-Version</h2><div class="card"><p class="muted small" style="margin:0">Version ${APPV}. Wenn eine Änderung nicht ankommt: hier tippen. Deine Einträge bleiben erhalten.</p><button class="btn" id="hardUpdate">App neu laden</button></div>
  <h2>Bildnachweise</h2><details><summary>${CREDITS.length} Fotos von Wikimedia Commons</summary><ul>${CREDITS.map(c=>`<li class="credit">${esc(c.title)}: ${esc(c.author)}, ${esc(c.license)} · <a href="${esc(c.source)}" target="_blank" rel="noopener">Quelle</a></li>`).join("")}</ul><p>Ortsbilder zeigen die Umgebung, nicht zwingend das genannte Restaurant.</p></details>`;
  $("#v-more").innerHTML=h;
  $("#startIn").onchange=e=>{if(e.target.value){S.start=e.target.value;save();toast("Datum geändert")}};
  $("#exportBtn").onclick=exportBackup;
  $("#hardUpdate").onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker?.getRegistrations?.();if(rs)await Promise.all(rs.map(r=>r.unregister()))}catch(e){}location.reload()};
  $("#importIn").onchange=e=>e.target.files[0]&&importBackup(e.target.files[0]);
}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportBackup(){
  const imgs=await imgAll(),enc={};for(const k in imgs)enc[k]=await b64(imgs[k]);
  const blob=new Blob([JSON.stringify({app:"japan-mai",v:1,state:S,images:enc})],{type:"application/json"});
  const file=new File([blob],"japan-mai-sicherung.json",{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Japan Mai Sicherung"});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$("#bkStatus").textContent="Sicherung heruntergeladen."}
async function importBackup(f){try{const d=JSON.parse(await f.text());if(d.app!=="japan-mai")throw 0;
  const db=await IDB;for(const k in d.images||{}){const blob=await (await fetch(d.images[k])).blob();await new Promise(r=>{const t=db.transaction("img","readwrite");t.objectStore("img").put(blob,k);t.oncomplete=r})}
  S={...S,...d.state};save();toast("Sicherung geladen");goTab("trip")}catch(e){$("#bkStatus").textContent="Diese Datei ist keine Japan-Mai-Sicherung.";$("#bkStatus").className="status err"}}

/* ---------- Tages-Story ---------- */
let ST=null;
function storySlides(i){
  const D=TRIP[i],d=dateOf(i),st=stopsOf(i),head=`Tag ${i+1} · ${WD[d.getDay()]} ${fmt(d)}`;
  const dayBg=D.photo?`photos/${D.photo}.jpg`:null;
  const slides=[{bg:dayBg,dur:5000,head,html:`<div class="eyebrow" style="color:rgba(255,255,255,.75)">${esc(D.stadt)} · ${st.length} Stationen</div><h2>${esc(D.titel)}</h2><p>${fmtLong(d)}</p>`}];
  st.forEach(s=>{const own=!s.photo&&s.ownImg;
    slides.push({bg:s.photo?`photos/${s.photo}.jpg`:dayBg,img:own?s.ownImg:null,soft:!s.photo&&!own,dur:s.typ==="Fahrt"?4000:5500,head,
      html:`<div><span class="stime">${esc(s.zeit)}</span><span class="sk">${esc(s.typ)}</span></div><h2>${esc(s.name)}</h2>${s.info?`<p>${eur(esc(s.info))}</p>`:""}
        <div class="meta">${[s.quelle?"Quelle: "+esc(s.quelle):"",s.reservierung?"Reservierung "+esc(bookState(s.id).status):"",closedOn(s,i)?"Ruhetag prüfen":""].filter(Boolean).join(" · ")}</div>`})});
  slides.push({bg:dayBg,soft:true,dur:8000,head,html:`<div class="eyebrow" style="color:rgba(255,255,255,.75)">Der Tag im Überblick</div><h2>${esc(D.titel)}</h2>
    <ol>${st.map(s=>`<li><b>${esc(s.zeit)}</b>${esc(s.name)}</li>`).join("")}</ol><div class="meta">Übernachtung: ${esc(D.unterkunft)}</div>`});
  return slides;
}
function openStory(i){
  closeStory();
  const el=document.createElement("div");el.className="story";el.setAttribute("role","dialog");el.setAttribute("aria-label","Tagesvorschau");
  const slides=storySlides(i);
  el.innerHTML=`<div class="bg"></div><div class="shade"></div><div class="bars">${slides.map(()=>"<span><i></i></span>").join("")}</div>
    <div class="head"><span class="hd"></span><button class="close" aria-label="Schließen">×</button></div>
    <div class="tap"><button aria-label="Zurück"></button><button aria-label="Weiter"></button></div><div class="txt"></div><div class="paused" hidden>Pause</div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  ST={el,slides,k:-1,t0:0,elapsed:0,paused:false,raf:0,day:i};
  const [prev,next]=el.querySelectorAll(".tap button");
  let holdT=0,held=false;
  const down=()=>{held=false;holdT=setTimeout(()=>{held=true;pauseStory(true)},250)};
  const up=fn=>()=>{clearTimeout(holdT);if(held){pauseStory(false)}else fn()};
  prev.addEventListener("pointerdown",down);next.addEventListener("pointerdown",down);
  prev.addEventListener("pointerup",up(()=>goSlide(ST.k-1)));next.addEventListener("pointerup",up(()=>goSlide(ST.k+1)));
  [prev,next].forEach(b=>b.addEventListener("pointerleave",()=>{clearTimeout(holdT);if(held){held=false;pauseStory(false)}}));
  el.querySelector(".close").addEventListener("click",closeStory);
  goSlide(0);ST.raf=requestAnimationFrame(tick);
}
async function goSlide(k){
  if(!ST)return;const {el,slides}=ST;
  if(k<0)k=0;
  if(k>=slides.length){closeStory();return}
  ST.k=k;ST.elapsed=0;ST.t0=performance.now();
  const sl=slides[k];
  el.querySelectorAll(".bars i").forEach((b,j)=>b.style.width=j<k?"100%":"0");
  el.querySelector(".hd").textContent=sl.head;
  const old=el.querySelector(".bg"),bg=document.createElement("div");
  bg.className="bg"+(sl.soft?" soft":" kb");bg.style.setProperty("--dur",sl.dur+"ms");
  let src=sl.bg;if(sl.img){const u=await imgUrl(sl.img);if(u)src=u;if(!ST||ST.k!==k)return}
  if(src)bg.style.backgroundImage=`url("${src}")`;old.replaceWith(bg);
  if(ST.paused)bg.style.animationPlayState="paused";
  const t=el.querySelector(".txt"),nt=t.cloneNode(false);nt.innerHTML=sl.html;t.replaceWith(nt);
}
function tick(now){
  if(!ST)return;
  if(!ST.paused){const sl=ST.slides[ST.k];const e=ST.elapsed+(now-ST.t0);
    const bar=ST.el.querySelectorAll(".bars i")[ST.k];if(bar)bar.style.width=Math.min(100,e/sl.dur*100)+"%";
    if(e>=sl.dur){goSlide(ST.k+1)}}
  if(ST)ST.raf=requestAnimationFrame(tick);
}
function pauseStory(p){if(!ST||ST.paused===p)return;const now=performance.now();
  if(p){ST.elapsed+=now-ST.t0}else{ST.t0=now}
  ST.paused=p;ST.el.querySelector(".paused").hidden=!p;const bg=ST.el.querySelector(".bg");if(bg)bg.style.animationPlayState=p?"paused":"running"}
function closeStory(){if(!ST)return;cancelAnimationFrame(ST.raf);ST.el.remove();ST=null;document.body.style.overflow=""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-story]");if(b)openStory(+b.dataset.story)});
document.addEventListener("keydown",e=>{if(!ST)return;if(e.key==="Escape")closeStory();if(e.key==="ArrowRight")goSlide(ST.k+1);if(e.key==="ArrowLeft")goSlide(ST.k-1);if(e.key===" "){e.preventDefault();pauseStory(!ST.paused)}});
document.addEventListener("visibilitychange",()=>{if(ST)pauseStory(document.hidden)});

/* ---------- Budget ---------- */
let fxView="budget";const openBDays=new Set();
function bset(){if(!S.budget)S.budget={persons:3,daily:2000,ov:{},skip:{}};return S.budget}
function katOf(s){if(s.typ==="Fahrt")return null;if(s.kat)return s.kat;return s.typ==="Sehen"?"Eintritt":"Essen"}
function priceOf(s){const b=bset();if(b.ov[s.id]!=null)return b.ov[s.id];if(s.preis!=null)return s.preis;return s.typ==="Sehen"?0:(s.zeit>="16:00"?5000:2500)}
const toMin=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
// Zwei Essen innerhalb von 45 Minuten: das günstigere gilt als Alternative
function altMap(i){const ess=stopsOf(i).filter(s=>s.typ==="Essen"),m={};
  for(let a=0;a<ess.length;a++)for(let b=a+1;b<ess.length;b++){const x=ess[a],y=ess[b];
    if(Math.abs(toMin(x.zeit)-toMin(y.zeit))<=45){const cheap=priceOf(x)<=priceOf(y)?x:y,other=cheap===x?y:x;if(!m[cheap.id])m[cheap.id]=other.name}}
  return m}
function counted(s,i){const b=bset();if(b.skip[s.id]!=null)return!b.skip[s.id];return!altMap(i)[s.id]}
function dayCost(i){let e=0,f=0;for(const s of stopsOf(i)){if(!katOf(s)||!counted(s,i))continue;const p=priceOf(s);if(katOf(s)==="Eintritt")e+=p;else f+=p}return{e,f}}
function renderBudget(){
  const b=bset(),n=b.persons,R=effRate();let E=0,F=0;
  for(let i=0;i<14;i++){const c=dayCost(i);E+=c.e;F+=c.f}
  const SN=b.daily*14,pp=E+F+SN,tot=pp*n,pct=v=>pp?(v/pp*100).toFixed(1):0;
  let h=`<div class="bhero"><div class="eyebrow">Geschätzt für ${n} ${n===1?"Person":"Personen"} · 14 Tage</div>
    <div class="bbig">${fmtEur(tot/R)} €</div><div class="muted small">¥${fmtYen(tot)} · pro Person ≈ ${fmtEur(pp/R)} €</div>
    <div class="bbar" aria-hidden="true"><i style="width:${pct(E)}%;background:var(--b1)"></i><i style="width:${pct(F)}%;background:var(--b2)"></i><i style="width:${pct(SN)}%;background:var(--b3)"></i></div>
    <div class="blegend"><span><i style="background:var(--b1)"></i>Eintritte & Shows</span><b>${fmtEur(E*n/R)} €</b>
      <span><i style="background:var(--b2)"></i>Essen & Trinken im Plan</span><b>${fmtEur(F*n/R)} €</b>
      <span><i style="background:var(--b3)"></i>Frühstück & Snacks</span><b>${fmtEur(SN*n/R)} €</b></div></div>
  <div class="card" style="margin-top:12px"><div class="brow2"><span>Personen</span><div class="stepper"><button data-pers="-1" aria-label="Weniger">−</button><b>${n}</b><button data-pers="1" aria-label="Mehr">+</button></div></div>
    <label class="field"><span>Frühstück & Snacks pro Person und Tag (¥)</span><input id="bDaily" inputmode="numeric" value="${fmtYen(b.daily)}"></label>
    <p class="muted small" style="margin:0">Ohne Hotels, Flüge und Bahn. Alle Preise sind Schätzungen pro Person – antippen und an echte Preise anpassen. Sind zwei Essen zur selben Zeit geplant, zählt nur das teurere, das andere ist als Alternative markiert.</p></div>
  <h2>Pro Tag</h2><div class="list">`;
  for(let i=0;i<14;i++){const D=TRIP[i],d=dateOf(i),c=dayCost(i),alt=altMap(i),dt=(c.e+c.f+b.daily)*n;
    h+=`<details class="bday" data-bday="${i}" ${openBDays.has(i)?"open":""}><summary><span><span class="eyebrow">Tag ${i+1} · ${WD[d.getDay()]} ${fmt(d)}</span><b class="bdt">${esc(D.titel)}</b></span><span class="bsum">${fmtEur(dt/R)} €</span></summary>`;
    for(const s of stopsOf(i)){if(!katOf(s))continue;const on=counted(s,i),pr=priceOf(s);
      h+=`<div class="brow ${on?"":"off"}"><input type="checkbox" data-bskip="${s.id}" data-bd="${i}" ${on?"checked":""} aria-label="${esc(s.name)} einrechnen">
        <div class="bname"><span>${esc(s.name)}</span><span class="muted small">${katOf(s)==="Eintritt"?"Eintritt":"Essen & Trinken"}${s.preisInfo?" · "+esc(s.preisInfo):""}${!on&&alt[s.id]&&b.skip[s.id]==null?" · Alternative zu "+esc(alt[s.id]):""}</span></div>
        <label class="bprice">¥<input inputmode="numeric" data-bprice="${s.id}" value="${pr?fmtYen(pr):"0"}" aria-label="Preis pro Person für ${esc(s.name)}"></label></div>`}
    h+=`<div class="brow snack"><span></span><div class="bname">Frühstück & Snacks</div><span class="bprice">¥${fmtYen(b.daily)}</span></div>
      <div class="bfoot">pro Person ¥${fmtYen(c.e+c.f+b.daily)} · × ${n} = ¥${fmtYen(dt)} ≈ ${fmtEur(dt/R)} €</div></details>`}
  h+=`</div>`;
  $("#fxBody").innerHTML=h;
  $("#bDaily").addEventListener("change",e=>{b.daily=Math.max(0,parseNum(e.target.value));save();renderBudget()});
  document.querySelectorAll("details.bday").forEach(el=>el.addEventListener("toggle",()=>{const i=+el.dataset.bday;el.open?openBDays.add(i):openBDays.delete(i)}));
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-fxview]");if(v){fxView=v.dataset.fxview;renderFx();return}
  const pz=e.target.closest("[data-pers]");if(pz){const b=bset();b.persons=Math.max(1,Math.min(12,b.persons+ +pz.dataset.pers));save();renderBudget();return}
  const gb=e.target.closest("[data-gobudget]");if(gb){const i=+gb.dataset.gobudget;fxView="budget";openBDays.add(i);goTab("fx");setTimeout(()=>document.querySelector(`details.bday[data-bday="${i}"]`)?.scrollIntoView({block:"start"}),60)}
});
document.addEventListener("change",e=>{
  const id=e.target.dataset.bskip;if(id!==undefined){const b=bset(),i=+e.target.dataset.bd,def=!altMap(i)[id];
    if(e.target.checked===def)delete b.skip[id];else b.skip[id]=!e.target.checked;save();renderBudget();return}
  const pid=e.target.dataset.bprice;if(pid!==undefined){bset().ov[pid]=Math.max(0,parseNum(e.target.value));save();renderBudget()}
});

/* ---------- Yen-Umrechner ---------- */
const FXKEY="jm-fx-v1";
let FX={rate:185.75,date:"2026-08-27",src:"Richtwert",fee:0};
try{const f=JSON.parse(localStorage.getItem(FXKEY)||"null");if(f&&f.rate)FX={...FX,...f}}catch(e){}
function saveFx(){try{localStorage.setItem(FXKEY,JSON.stringify(FX))}catch(e){}}
const effRate=()=>FX.rate/(1+(+FX.fee||0)/100);
const fmtEur=v=>v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtYen=v=>Math.round(v).toLocaleString("de-DE");
const parseNum=t=>{t=String(t||"").replace(/\s/g,"");if(/^\d{1,3}([.,]\d{3})+$/.test(t))t=t.replace(/[.,]/g,"");else t=t.replace(/\./g,"").replace(",",".");return parseFloat(t)||0};
function eur(html){return html.replace(/(¥|￥|JPY\s?)\s?(\d[\d.,]*\d|\d)(\+?)/g,(m,c,n)=>{const v=parseNum(n);if(!v)return m;return `${m} <span class="eurnote">(≈ ${fmtEur(v/effRate())} €)</span>`})}
async function refreshFx(force){
  const age=Date.now()-(FX.fetched||0);
  if(!force&&age<6*3600e3)return false;
  const tries=[
    async()=>{const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=JPY");const j=await r.json();return{rate:j.rates.JPY,date:j.date,src:"EZB"}},
    async()=>{const r=await fetch("https://open.er-api.com/v6/latest/EUR");const j=await r.json();return{rate:j.rates.JPY,date:new Date(j.time_last_update_unix*1000).toISOString().slice(0,10),src:"ExchangeRate-API"}}
  ];
  for(const t of tries){try{const x=await t();if(x.rate>50&&x.rate<400){FX={...FX,...x,fetched:Date.now()};saveFx();return true}}catch(e){}}
  return false;
}
function renderFx(){
  const d=FX.date?new Date(FX.date+"T12:00:00").toLocaleDateString("de-AT"):"";
  $("#v-fx").innerHTML=`<div class="topbar"><div><div class="eyebrow">Geld</div><h1>${fxView==="budget"?"Reisebudget":"Yen ↔ Euro"}</h1></div></div>
    <div class="seg seg2" role="group" aria-label="Ansicht"><button data-fxview="budget" aria-pressed="${fxView==="budget"}">Budget</button><button data-fxview="conv" aria-pressed="${fxView==="conv"}">Umrechner</button></div><div id="fxBody"></div>`;
  if(fxView==="budget"){renderBudget();return}
  let h=`
  <div class="fxcard">
    <div class="fxrow"><span class="cur">¥</span><label><span>Yen</span><input id="fxY" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Betrag in Yen"></label></div>
    <div class="fxrow"><span class="cur">€</span><label><span>Euro</span><input id="fxE" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Betrag in Euro"></label></div>
  </div>
  <div class="quick">${[500,1000,3000,5000,10000,30000].map(v=>`<button data-yen="${v}">${fmtYen(v)} ¥</button>`).join("")}</div>
  <div class="ratebar"><span>1 € = ${FX.rate.toLocaleString("de-AT",{maximumFractionDigits:2})} ¥ · ${esc(FX.src)}${d?", Stand "+d:""}</span><button id="fxRefresh">Kurs aktualisieren</button></div>
  <h2>Kartengebühr</h2>
  <div class="card"><label class="field"><span>Aufschlag deiner Karte in %</span><input id="fxFee" inputmode="decimal" value="${String(FX.fee||0).replace(".",",")}"></label>
  <p class="muted small" style="margin:0">Viele Kreditkarten verlangen 1–2 % Auslandsgebühr. Trag sie ein, dann rechnet die App mit dem echten Preis. Bei der Frage am Automaten oder an der Kasse immer <b>in Yen zahlen</b> wählen, sonst rechnet die Bank des Händlers mit schlechtem Kurs um.</p></div>
  <h2>Zum Merken</h2>
  <table class="fxt">${[[100,"Getränk am Automaten"],[1000,"Ramen, Konbini-Einkauf"],[3000,"Mittagsmenü, Museum"],[10000,"Gutes Abendessen"],[30000,"Omakase, Kaiseki"]].map(([y,t])=>`<tr><td><b>${fmtYen(y)} ¥</b> · ${t}</td><td>≈ ${fmtEur(y/effRate())} €</td></tr>`).join("")}</table>
  <p class="muted small">Faustregel: Yen durch ${Math.round(effRate()/10)*10} teilen, oder 1.000 ¥ ≈ ${fmtEur(1000/effRate())} €. Ohne Netz rechnet die App mit dem zuletzt geladenen Kurs.</p>`;
  $("#fxBody").innerHTML=h;
  const Y=$("#fxY"),E=$("#fxE");
  const fromY=()=>{const v=parseNum(Y.value);E.value=Y.value.trim()?fmtEur(v/effRate()):""};
  const fromE=()=>{const v=parseNum(E.value);Y.value=E.value.trim()?fmtYen(v*effRate()):""};
  Y.addEventListener("input",fromY);E.addEventListener("input",fromE);
  if(FX.lastY){Y.value=fmtYen(FX.lastY);fromY()}
  Y.addEventListener("change",()=>{FX.lastY=parseNum(Y.value);saveFx()});
  $("#fxFee").addEventListener("change",e=>{FX.fee=Math.max(0,Math.min(10,parseNum(e.target.value)));saveFx();renderFx()});
  $("#fxRefresh").onclick=async e=>{e.target.textContent="Lade …";const ok=await refreshFx(true);renderFx();toast(ok?"Kurs aktualisiert":"Kein Netz – alter Kurs bleibt")};
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-yen]");if(!b)return;const Y=$("#fxY");Y.value=fmtYen(+b.dataset.yen);Y.dispatchEvent(new Event("input"));FX.lastY=+b.dataset.yen;saveFx()});
refreshFx(false).then(ok=>{if(ok&&tab==="fx")renderFx()});

const APPV="13 vom 27.10.2026";
/* ---------- Start ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2000)}
goTab("trip");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
